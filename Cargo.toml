[package]
name = "mangadex-dl"
version = "1.2.0"
edition = "2021"
description = "Личный некоммерческий загрузчик страниц глав MangaDex"
publish = false
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
eframe = "0.36"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "charset", "gzip", "http2", "json", "rustls"] }
serde_json = "1"
unicode-normalization = "0.1"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
