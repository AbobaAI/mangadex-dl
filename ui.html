<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mangadex-dl</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3efe6;
      --ink: #1c1915;
      --muted: #5f594f;
      --line: #ddd4c6;
      --paper: #e7e0d4;
      --track: #cfc4b4;
      --accent: #8d3428;
      --accent-ink: #fff8f4;
      --ok: #215c40;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #141210;
        --ink: #f4efe6;
        --muted: #b2aa9e;
        --line: #2e2924;
        --paper: #221e1a;
        --track: #3a342c;
        --accent: #e08a78;
        --accent-ink: #1a100e;
        --ok: #8dccab;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; }
    body {
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", Cantarell, "Noto Sans", "Liberation Sans", sans-serif;
      font-size: 16px;
      line-height: 1.45;
    }
    main {
      display: flex;
      flex-direction: column;
      width: min(760px, calc(100% - 32px));
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      padding-top: 36px;
    }
    .sheet {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding-bottom: 24px;
      scrollbar-gutter: stable;
      overscroll-behavior: contain;
    }
    .mark {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.75rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .lede { margin: 0 0 32px; color: var(--muted); }
    .label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .search, .save {
      display: grid;
      gap: 16px 20px;
      align-items: end;
    }
    .search { grid-template-columns: minmax(0, 1fr) 11rem auto; }
    .search label, .folder { min-width: 0; }
    .tools {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 8px 16px;
      margin: 22px 0 8px;
    }
    .tools label { flex: 1 1 12rem; min-width: 0; }
    .tool-actions { display: flex; flex-wrap: wrap; gap: 4px 16px; }
    .dock {
      flex: none;
      padding: 12px 0 16px;
      background: var(--bg);
      border-top: 1px solid var(--line);
    }
    .save { grid-template-columns: minmax(0, 1fr) auto auto; }
    input, select, button { font: inherit; color: inherit; }
    input[type="text"], select {
      width: 100%;
      padding: 8px 0;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
    }
    input:focus, select:focus, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    input:focus, select:focus { border-bottom-color: var(--accent); }
    button {
      padding: 8px 0;
      background: transparent;
      border: 0;
      border-bottom: 1px solid transparent;
      cursor: pointer;
    }
    button:disabled { cursor: default; }
    .primary:disabled { background: var(--paper); color: var(--muted); }
    .text-btn { border-bottom-color: var(--ink); }
    .primary {
      padding: 10px 16px;
      background: var(--accent);
      color: var(--accent-ink);
      border: 0;
    }
    .check {
      display: flex;
      gap: 8px;
      align-items: center;
      padding-bottom: 8px;
      color: var(--muted);
    }
    .notice { min-height: 1.4em; margin: 14px 0; color: var(--accent); }
    input[type="checkbox"] { accent-color: var(--accent); }
    .results, .chapters { margin: 0; padding: 0; list-style: none; }
    .chapters { border-bottom: 1px solid var(--line); }
    .result {
      display: flex;
      gap: 14px;
      width: 100%;
      padding: 12px 0;
      text-align: left;
      background: transparent;
      border: 0;
      border-top: 1px solid var(--line);
      cursor: pointer;
    }
    .result:hover .result-title, .result[aria-current="true"] .result-title { color: var(--accent); }
    .thumb, .cover {
      flex: none;
      object-fit: cover;
      background: var(--paper);
      border: 1px solid var(--line);
    }
    .thumb { width: 36px; height: 52px; }
    .cover { width: 72px; height: 104px; }
    .result-title, .title-name { margin: 0; font-weight: 600; }
    .meta, .sub { margin: 2px 0 0; color: var(--muted); font-size: 0.92rem; }
    .title-block {
      display: flex;
      gap: 16px;
      align-items: flex-end;
      margin-top: 28px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .chips button {
      padding: 3px 8px;
      color: var(--muted);
      border: 1px solid var(--line);
    }
    .chips button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
    .chapter {
      display: grid;
      grid-template-columns: 1.5rem 6.4rem 5rem 5.6rem minmax(0, 1fr);
      gap: 10px;
      align-items: baseline;
      padding: 8px 0;
      border-top: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
    }
    .chapter.head {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--bg);
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .chapter .name {
      overflow: hidden;
      color: var(--muted);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .count { align-self: center; color: var(--muted); font-size: 0.92rem; }
    .track { height: 4px; margin-top: 12px; background: var(--track); }
    .track > div { width: 0; height: 100%; background: var(--accent); transition: width 160ms linear; }
    .progress p { margin: 8px 0 0; }
    .progress .done { color: var(--ok); }
    .ghost { margin-top: 8px; color: var(--muted); border-bottom-color: var(--line); }
    @media (max-width: 680px) {
      main { padding-top: 20px; }
      .search { grid-template-columns: minmax(0, 1fr) auto; }
      .search label:first-child { grid-column: 1 / -1; }
      .tools label { flex-basis: 100%; }
      .title-block { margin-top: 16px; }
      .cover { width: 64px; height: 92px; }
      .sheet { padding-right: 16px; }
      .save { grid-template-columns: 1fr; }
      #go, #stop { width: 100%; }
      .chapter { grid-template-columns: 1.5rem 6.4rem 5.2rem minmax(0, 1fr); }
      .chapter .volume { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .track > div { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="sheet">
    <p class="mark">mangadex-dl</p>
    <p class="lede">Личное чтение. Страницы выбранных глав сохраняются на диск.</p>

    <form class="search" id="search">
      <label>
        <span class="label">Тайтл или ссылка</span>
        <input id="query" type="text" autocomplete="off" autofocus placeholder="название или адрес MangaDex">
      </label>
      <label>
        <span class="label">Язык</span>
        <select id="lang">
          <option value="ru" selected>русский</option>
          <option value="en">english</option>
          <option value="uk">українська</option>
          <option value="be">беларуская</option>
          <option value="es">español</option>
          <option value="es-la">español (LATAM)</option>
          <option value="pt-br">português</option>
          <option value="fr">français</option>
          <option value="de">deutsch</option>
          <option value="pl">polski</option>
          <option value="it">italiano</option>
          <option value="tr">türkçe</option>
          <option value="id">indonesia</option>
          <option value="vi">tiếng việt</option>
          <option value="th">ไทย</option>
          <option value="zh">中文</option>
          <option value="zh-hk">中文（香港）</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
        </select>
      </label>
      <button class="text-btn" id="find" type="submit">Найти</button>
    </form>

    <p class="notice" id="notice" role="status"></p>
    <div id="results"></div>

    <section id="work" hidden>
      <div class="title-block">
        <img class="cover" id="cover" alt="" hidden>
        <div>
          <h1 class="title-name" id="title-name"></h1>
          <p class="meta" id="title-meta"></p>
          <div class="chips" id="chips"></div>
        </div>
      </div>

      <div class="tools">
        <label>
          <span class="label">Отметить главы</span>
          <input id="spec" type="text" placeholder="12, 1-5, all">
        </label>
        <div class="tool-actions">
          <button class="text-btn" id="apply" type="button">Отметить</button>
          <button class="text-btn" id="all" type="button">Все</button>
          <button class="text-btn" id="clear" type="button">Снять</button>
        </div>
      </div>
      <p class="count" id="count"></p>
      <div class="chapter head" aria-hidden="true">
        <span></span><span>глава</span><span class="volume">том</span><span>стр.</span><span>перевод</span>
      </div>
      <div class="chapters" id="chapters"></div>
    </section>
    </div>

    <div class="dock" id="dock" hidden>
      <form class="save" id="save">
        <label class="folder">
          <span class="label">Папка</span>
          <input id="out" type="text">
        </label>
        <label class="check"><input id="saver" type="checkbox"> сжатые</label>
        <button class="primary" id="go" type="submit">Скачать</button>
        <button class="primary" id="stop" type="button" hidden>Остановить</button>
      </form>
      <div class="progress" id="progress" hidden>
        <div class="track" aria-hidden="true"><div id="bar"></div></div>
        <p id="progress-text" role="status"></p>
        <button class="ghost" id="reveal" type="button" hidden>Открыть папку</button>
      </div>
    </div>
  </main>
  <script>
    const STATUS = {
      ongoing: "выходит",
      completed: "завершён",
      hiatus: "пауза",
      cancelled: "отменён"
    };
    const notice = document.querySelector("#notice");
    const results = document.querySelector("#results");
    const work = document.querySelector("#work");
    const chaptersEl = document.querySelector("#chapters");
    const langSelect = document.querySelector("#lang");
    let chapters = [];
    let anchor = 0;
    let poll = 0;

    function setNotice(text) {
      notice.textContent = text || "";
    }

    async function api(path, body) {
      const response = await fetch(path, body ? {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      } : undefined);
      let data = {};
      try { data = await response.json(); } catch (error) { data = {}; }
      if (!response.ok) throw new Error(data.error || "не получилось");
      return data;
    }

    function ensureLang(code) {
      if (!code || [...langSelect.options].some((option) => option.value === code)) return;
      const option = document.createElement("option");
      option.value = code;
      option.textContent = code;
      langSelect.append(option);
    }

    function thumb(src, title) {
      const image = document.createElement("img");
      image.className = "thumb";
      image.alt = "";
      if (!src) {
        image.hidden = true;
        return image;
      }
      image.src = src;
      image.addEventListener("error", () => { image.hidden = true; });
      return image;
    }

    function renderResults(data) {
      results.replaceChildren();
      if (!data.results || !data.results.length) return;
      if (data.manga && data.results.length === 1) return;
      const note = document.createElement("p");
      note.className = "meta";
      const shown = data.results.length;
      note.textContent = data.total > shown
        ? `Показаны ${shown} из ${data.total}. Если нужного нет, вставьте ссылку на тайтл.`
        : `Найдено: ${data.total}.`;
      results.append(note);
      for (const manga of data.results) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "result";
        if (data.manga && data.manga.id === manga.id) button.setAttribute("aria-current", "true");
        button.append(thumb(manga.cover, manga.title));
        const text = document.createElement("span");
        const name = document.createElement("span");
        name.className = "result-title";
        name.textContent = manga.title;
        const meta = document.createElement("span");
        meta.className = "meta";
        const bits = [manga.year || "—", STATUS[manga.status] || manga.status || "—"];
        if (manga.original_title && manga.original_title !== manga.title) bits.push(manga.original_title);
        meta.textContent = bits.join(" · ");
        text.append(name, document.createElement("br"), meta);
        button.append(text);
        button.addEventListener("click", () => openManga(manga.id));
        results.append(button);
      }
    }

    function renderManga(manga) {
      const dock = document.querySelector("#dock");
      if (!manga) {
        work.hidden = true;
        dock.hidden = true;
        return;
      }
      work.hidden = false;
      dock.hidden = false;
      document.querySelector("#title-name").textContent = manga.title;
      const bits = [manga.year || "—", STATUS[manga.status] || manga.status || "—"];
      if (manga.original_title && manga.original_title !== manga.title) bits.push(manga.original_title);
      document.querySelector("#title-meta").textContent = bits.join(" · ");
      const cover = document.querySelector("#cover");
      cover.hidden = !manga.cover;
      cover.alt = manga.title;
      if (manga.cover) {
        cover.src = manga.cover;
        cover.onerror = () => { cover.hidden = true; };
      }
      const chips = document.querySelector("#chips");
      chips.replaceChildren();
      for (const code of manga.languages || []) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = code;
        button.setAttribute("aria-pressed", code === langSelect.value ? "true" : "false");
        button.addEventListener("click", () => {
          langSelect.value = code;
          openManga(manga.id);
        });
        chips.append(button);
      }
    }

    function checkedBoxes() {
      return [...chaptersEl.querySelectorAll("input[data-id]")];
    }

    function updateCount() {
      const boxes = checkedBoxes().filter((box) => box.checked);
      const pages = boxes.reduce((sum, box) => sum + Number(box.dataset.pages || 0), 0);
      document.querySelector("#count").textContent = boxes.length
        ? `Выбрано ${boxes.length} · ${pages} стр.`
        : "Ничего не отмечено";
      document.querySelector("#go").disabled = boxes.length === 0;
    }

    function renderChapters(list, selected) {
      chapters = list || [];
      const wanted = new Set(selected || []);
      chaptersEl.replaceChildren();
      anchor = 0;
      chapters.forEach((chapter, index) => {
        const row = document.createElement("label");
        row.className = "chapter";
        const box = document.createElement("input");
        box.type = "checkbox";
        box.dataset.id = chapter.id;
        box.dataset.pages = String(chapter.pages || 0);
        box.checked = wanted.has(chapter.id);
        box.disabled = chapter.external;
        box.addEventListener("click", (event) => {
          if (event.shiftKey) {
            const from = Math.min(anchor, index);
            const to = Math.max(anchor, index);
            const boxes = checkedBoxes();
            for (let cursor = from; cursor <= to; cursor += 1) {
              if (!boxes[cursor].disabled) boxes[cursor].checked = box.checked;
            }
          }
          anchor = index;
          updateCount();
        });
        const number = document.createElement("span");
        number.textContent = chapter.number;
        const volume = document.createElement("span");
        volume.className = "volume";
        volume.textContent = chapter.volume ? `том ${chapter.volume}` : "";
        const pages = document.createElement("span");
        pages.textContent = chapter.external ? "внешняя" : `${chapter.pages} стр.`;
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = [chapter.group, chapter.title].filter(Boolean).join(" · ");
        row.append(box, number, volume, pages, name);
        chaptersEl.append(row);
      });
      updateCount();
    }

    function focusWork() {
      if (work.hidden) return;
      const row = chaptersEl.querySelector(".chapter");
      const sheet = document.querySelector(".sheet");
      if (!row) {
        sheet.scrollTop = work.offsetTop;
        return;
      }
      const rowBox = row.getBoundingClientRect();
      const sheetBox = sheet.getBoundingClientRect();
      const below = rowBox.bottom - (sheetBox.bottom - 16);
      if (below > 0) sheet.scrollTop += below;
      const above = sheetBox.top + 8 - row.getBoundingClientRect().top;
      if (above > 0) sheet.scrollTop -= above;
    }

    function applyState(data, selected) {
      if (data.out) document.querySelector("#out").value = data.out;
      if (data.lang) {
        ensureLang(data.lang);
        langSelect.value = data.lang;
      }
      renderResults(data);
      renderManga(data.manga);
      if (data.manga) renderChapters(data.chapters, selected);
      if (data.job) renderJob(data.job);
    }

    function renderJob(job) {
      const panel = document.querySelector("#progress");
      const running = Boolean(job.running);
      panel.hidden = !running && !job.message;
      document.querySelector("#bar").style.width = `${Math.round((job.progress || 0) * 100)}%`;
      const text = document.querySelector("#progress-text");
      text.textContent = job.error || job.message || "";
      text.classList.toggle("done", !running && !job.error && !job.stopped);
      document.querySelector("#stop").hidden = !running;
      document.querySelector("#go").hidden = running;
      document.querySelector("#reveal").hidden = running || !job.folder;
      document.querySelector("#find").disabled = running;
      if (running) watch();
    }

    function watch() {
      if (poll) return;
      poll = window.setInterval(async () => {
        try {
          const job = await api("/api/job");
          renderJob(job);
          if (!job.running) {
            window.clearInterval(poll);
            poll = 0;
            updateCount();
          }
        } catch (error) {
          setNotice(error.message);
        }
      }, 400);
    }

    async function openManga(id) {
      setNotice("Собираю главы…");
      const data = await api("/api/open", { id, lang: langSelect.value });
      setNotice(data.chapters && data.chapters.length ? "" : "На этом языке глав нет.");
      applyState(data, data.select || []);
      focusWork();
    }

    document.querySelector("#search").addEventListener("submit", async (event) => {
      event.preventDefault();
      const query = document.querySelector("#query").value.trim();
      if (!query) return;
      setNotice("Ищу…");
      document.querySelector("#find").disabled = true;
      try {
        const data = await api("/api/search", { query, lang: langSelect.value });
        const emptyManga = data.manga && (!data.chapters || !data.chapters.length);
        setNotice(emptyManga ? "На этом языке глав нет." : (data.results.length ? "" : "Ничего не нашлось."));
        applyState(data, data.select || []);
        if (data.manga) focusWork();
      } catch (error) {
        setNotice(error.message);
      } finally {
        document.querySelector("#find").disabled = false;
      }
    });

    document.querySelector("#apply").addEventListener("click", async () => {
      const spec = document.querySelector("#spec").value.trim();
      if (!spec) return;
      try {
        const data = await api("/api/match", { spec });
        renderChapters(chapters, data.ids);
        setNotice("");
      } catch (error) {
        setNotice(error.message);
      }
    });

    document.querySelector("#all").addEventListener("click", () => {
      checkedBoxes().forEach((box) => { if (!box.disabled) box.checked = true; });
      updateCount();
    });
    document.querySelector("#clear").addEventListener("click", () => {
      checkedBoxes().forEach((box) => { box.checked = false; });
      updateCount();
    });

    document.querySelector("#save").addEventListener("submit", async (event) => {
      event.preventDefault();
      const ids = checkedBoxes().filter((box) => box.checked).map((box) => box.dataset.id);
      if (!ids.length) return;
      setNotice("");
      try {
        const job = await api("/api/download", {
          ids,
          out: document.querySelector("#out").value,
          saver: document.querySelector("#saver").checked
        });
        renderJob(job);
      } catch (error) {
        setNotice(error.message);
      }
    });

    document.querySelector("#stop").addEventListener("click", async () => {
      renderJob(await api("/api/cancel", {}));
    });
    document.querySelector("#reveal").addEventListener("click", async () => {
      try { await api("/api/reveal", {}); }
      catch (error) { setNotice(error.message); }
    });

    api("/api/state").then((data) => applyState(data, [])).catch((error) => setNotice(error.message));
  </script>
</body>
</html>
