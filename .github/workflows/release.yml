name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: mangadex-dl-linux-x64
          - os: windows-latest
            archive: mangadex-dl-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libvulkan-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo test
      - run: cargo build --release
      - name: Collect
        shell: bash
        run: |
          mkdir -p upload
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/mangadex-dl.exe "upload/${{ matrix.archive }}.exe"
          else
            cp target/release/mangadex-dl "upload/${{ matrix.archive }}"
            pkg="${{ matrix.archive }}"
            mkdir -p "$pkg"
            cp target/release/mangadex-dl "$pkg/"
            cp assets/mangadex-dl.desktop assets/mangadex-dl.svg "$pkg/"
            cp assets/mangadex-dl-512.png "$pkg/mangadex-dl.png"
            tar -czf "upload/$pkg.tar.gz" "$pkg"
            cp assets/mangadex-dl.desktop assets/mangadex-dl-512.png upload/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: upload/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Обычное окно программы и сборки для Windows и Linux. Исходники собираются через cargo. Терминал по-прежнему доступен через --cli."
